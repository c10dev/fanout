name: 플랫폼 기능 요청
description: 지원하는 플랫폼(YouTube·Instagram·Facebook·X·TikTok 등)에서 더 쓰고 싶은 기능. 새 플랫폼은 지금 받지 않습니다
labels: [platform]
body:
  - type: input
    id: platform
    attributes:
      label: 플랫폼
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: 공식 API
      description: 그 기능의 공식 문서 링크, 필요한 권한·앱 심사, 한도를 아는 대로 적어 주세요. 공식 API로 안 되는 기능은 코어 대상이 아닙니다.
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?

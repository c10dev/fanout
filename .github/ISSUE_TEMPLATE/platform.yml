name: 플랫폼 요청
description: 새 영상 플랫폼 지원 요청
labels: [platform]
body:
  - type: input
    id: platform
    attributes:
      label: 플랫폼
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: 공식 업로드 API
      description: 공식 문서 링크, 앱 심사 필요 여부, 한도를 아는 대로 적어 주세요. 공식 API가 없으면 코어가 아닌 별도 플러그인 대상입니다.
  - type: textarea
    id: why
    attributes:
      label: 왜 필요한가요?

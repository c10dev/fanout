name: Integration

# Real PeerTube and Mastodon servers in Docker, driven through the fanout CLI end to end.
# Slower than CI (a few minutes each), so it runs weekly, on demand, and on PRs that touch
# these providers or the code paths they rely on.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
  pull_request:
    paths:
      - 'src/providers/peertube.ts'
      - 'src/providers/mastodon.ts'
      - 'src/core/runner.ts'
      - 'src/core/livecheck.ts'
      - 'src/core/posting.ts'
      - 'src/core/http.ts'
      - 'src/core/context.ts'
      - 'scripts/it/**'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        server: [peertube, mastodon]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: scripts/it/${{ matrix.server }}.sh

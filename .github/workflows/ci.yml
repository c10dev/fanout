name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Catches tests that hard-code a "future" date the real clock will pass.
      - name: Tests a year ahead
        run: npm test
        env:
          SHIFT_DAYS: '400'
          NODE_OPTIONS: --import=./scripts/shift-clock.mjs

      - name: Packaged CLI runs from node_modules
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/fanout-*.tgz
          FANOUT_HOME="$RUNNER_TEMP/home" "$RUNNER_TEMP/prefix/bin/fanout" platforms

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fanout:ci .
      - name: Smoke test
        run: |
          docker run --rm fanout:ci platforms
          docker run --rm --entrypoint ffmpeg fanout:ci -version
      - name: Dashboard answers as docker-compose.yml runs it
        run: |
          docker run -d --name fanout-smoke -e FANOUT_ASSUME_LOCAL=1 -p 127.0.0.1:8780:8780 fanout:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8780/ >/dev/null 2>&1 && break; sleep 1; done
          token=$(curl -fsS http://127.0.0.1:8780/ | sed -n 's/.*name="fanout-token" content="\([^"]*\)".*/\1/p')
          test -n "$token"
          curl -fsS -H "x-fanout-token: $token" http://127.0.0.1:8780/api/overview | grep -q '"settingsEnabled":true'
          docker rm -f fanout-smoke
